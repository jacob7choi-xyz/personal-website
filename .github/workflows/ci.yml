name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Detection, not enforcement. An advisory can be published, or an exception in
  # .github/audit-allowlist.json can expire, on a day with no commits, and
  # push/pull_request triggers alone would never notice. Note that scheduled
  # workflows on public repositories can be disabled after 60 days of
  # inactivity, so the pre-merge gate above stays authoritative.
  schedule:
    - cron: "17 6 * * 1"

# Least privilege, stated explicitly so the privilege contract is reviewable
# rather than inherited from repository or organisation defaults.
permissions:
  contents: read

jobs:
  # Renaming this job renames the check that branch protection requires. Treat it
  # as an externally referenced identifier.
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs: a tag is mutable and is not a
      # supply-chain guarantee. Dependabot keeps these current (see
      # .github/dependabot.yml), because pins rot silently without it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `node-version-file` is the ONLY version input here on purpose: if
      # `node-version` were also set it would win, and the .nvmrc migration would
      # be silently defeated while every other file looked correct.
      #
      # Scope of what .nvmrc actually guarantees: it pins CI, and it tells a local
      # version manager what to install. It does NOT enforce a local runtime on
      # its own, and `engines` is advisory to npm. So this aligns CI and the
      # declared intent; it does not prevent a developer running a different Node.
      # Vercel does not read .nvmrc, so `engines.node` pins the deploy runtime
      # separately and the two must be kept in step.
      #
      # Node 20 ended support 2026-04-30 (nodejs.org/dist schedule.json) and no
      # longer receives security fixes, which is disqualifying for the runtime
      # executing this security gate. 24 is LTS through 2028-04-30.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Prove the gate itself cannot fail open before trusting its verdict.
      - name: Test the advisory gate
        run: node scripts/audit-check.test.mjs

      # Fails closed. Replaces `npm audit --audit-level=critical`, which passed
      # while 20 distinct advisories were present.
      - name: Dependency advisory gate
        run: node scripts/audit-check.mjs
